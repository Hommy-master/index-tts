# 部署 CI 构建的镜像：Docker Hub 上为 <DOCKERHUB_USERNAME>/index-tts（见 .github/workflows/dev.yml）
#
# 首次启动：若 ./checkpoints 为空，容器内会自动从 Hugging Face 下载 IndexTeam/IndexTTS-2（与文档一致）。
# 已有人工下载的权重时，直接挂载到 ./checkpoints 即可；离线环境设 INDEX_TTS_SKIP_DOWNLOAD=1 并挂载完整目录。
#
# 启动：docker compose up -d
# 环境变量可写在同目录 .env 文件中（勿提交密钥）。
#
# 依赖：已安装 NVIDIA 驱动与 NVIDIA Container Toolkit（nvidia-smi 在宿主机可用）

services:
  index-tts:
    image: gogoshine/index-tts:latest
    container_name: index-tts
    restart: unless-stopped
    ports:
      - 7860:7860
    environment:
      # 可选：限制可见 GPU，例如 "0" 或 "0,1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # 中国大陆访问 Hugging Face 慢时可设：https://hf-mirror.com
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # 置为 1 则不做自动下载（须自行挂载含 bpe.model 等文件的 checkpoints）
      INDEX_TTS_SKIP_DOWNLOAD: ${INDEX_TTS_SKIP_DOWNLOAD:-0}
      INDEX_TTS_HF_REPO: ${INDEX_TTS_HF_REPO:-IndexTeam/IndexTTS-2}
    volumes:
      # 模型目录（与 Dockerfile CMD 中 --model_dir 一致）
      - ./checkpoints:/app/checkpoints
      # 可选：持久化生成结果与提示词
      - ./outputs:/app/outputs
      - ./prompts:/app/prompts
    # Gradio / PyTorch 在默认 64MB shm 下偶发问题，可按需调大
    shm_size: 2gb
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次需下载整包权重，用时可能较长；若 health 一直报 starting，可适当加大此值
      start_period: 1800s
