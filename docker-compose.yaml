# IndexTTS REST API 部署
#
# 提供声音克隆 + 语音合成 REST API：
#   POST /api/clone   - 上传参考音频克隆声音
#   GET  /api/voices  - 列出已克隆的声音
#   POST /api/tts     - 用克隆的声音生成语音
#   GET  /api/health  - 健康检查
#   GET  /docs        - Swagger API 文档
#
# 权重下载：api_server.py 启动时自动检测 /app/checkpoints 是否完整（IndexTTS-2.5），
# 缺失时自动从 ModelScope / HuggingFace 下载（断点续传），无需手动干预。
#
# 启动：docker compose up -d
#
# 依赖：NVIDIA 驱动 + NVIDIA Container Toolkit

services:
  index-tts:
    image: gogoshine/index-tts:latest
    container_name: index-tts
    restart: unless-stopped
    # 运行 REST API 服务器（api_server.py），端口 9880
    # FP16 + BigVGAN CUDA kernel；默认模型版本 2.5（IndexTTS-2.5）
    command:
      - python
      - api_server.py
      - --host
      - "0.0.0.0"
      - --port
      - "9880"
      - --model_dir
      - /app/checkpoints
      - --version
      - "2.5"
      - --fp16
      - --cuda_kernel
    ports:
      - "9880:9880"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # 模型下载源：true=ModelScope（国内推荐），false=HuggingFace
      USE_MODELSCOPE: "true"
      # Hugging Face 镜像（备用源）
      HF_ENDPOINT: https://hf-mirror.com
      # ---- 缓存全部落在挂载目录 /app/checkpoints（对应宿主机 ./docker/checkpoints）----
      HF_HOME: /app/checkpoints/.hf
      HF_HUB_CACHE: /app/checkpoints/hf_cache
      TRANSFORMERS_CACHE: /app/checkpoints/.hf/transformers
      TORCH_HOME: /app/checkpoints/.hf/torch
      XDG_CACHE_HOME: /app/checkpoints/.cache
      MODELSCOPE_CACHE: /app/checkpoints/.hf/modelscope
      HF_HUB_DISABLE_XET: "1"
      # CPU 侧预处理 / BLAS 线程
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      NUMEXPR_NUM_THREADS: "6"
      # 减轻显存碎片导致的卡顿（PyTorch 2.x）
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      # 模型权重持久化
      - ./checkpoints:/app/checkpoints
      # 生成的音频输出
      - ./outputs:/app/outputs
      # 克隆的声音参考音频
      - ./prompts:/app/prompts
    shm_size: 2gb
    cpus: '6'
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9880/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次启动需下载权重，预留充足时间
      start_period: 1800s
