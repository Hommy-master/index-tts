# 部署镜像（默认 gogoshine/index-tts:latest，可按需改 image）。
#
# 权重不在容器内下载：请先在宿主机准备好 checkpoints（见 README Model Download），
# 通过 ./checkpoints 挂载进容器。推理时若缺失 Hugging Face 依赖缓存，仍可设置 HF_ENDPOINT 等。
#
# 启动：docker compose up -d
#
# 依赖：NVIDIA 驱动 + NVIDIA Container Toolkit

services:
  index-tts:
    image: gogoshine/index-tts:latest
    container_name: index-tts
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Hugging Face 镜像（可选：运行时仍需拉取少量 hub 文件时使用）
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      - ./prompts:/app/prompts
    shm_size: 2gb
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3600s
