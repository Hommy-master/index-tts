# 部署镜像（默认 gogoshine/index-tts:latest，可按需改 image）。
#
# 权重下载：webui.py 启动时自动检测 /app/checkpoints 是否完整（IndexTTS-2.5），
# 缺失时自动从 ModelScope / HuggingFace 下载（断点续传），无需手动干预。
#
# 启动：docker compose up -d
#
# 依赖：NVIDIA 驱动 + NVIDIA Container Toolkit

services:
  index-tts:
    image: gogoshine/index-tts:latest
    container_name: index-tts
    restart: unless-stopped
    # FP16 + BigVGAN CUDA kernel；默认模型版本 2.5（IndexTTS-2.5）
    command:
      - python
      - webui.py
      - --host
      - "0.0.0.0"
      - --port
      - "7860"
      - --model_dir
      - /app/checkpoints
      - --version
      - "2.5"
      - --fp16
      - --cuda_kernel
    ports:
      - "7860:7860"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # 模型下载源：true=ModelScope（国内推荐），false=HuggingFace
      USE_MODELSCOPE: "true"
      # Hugging Face 镜像（备用源）
      HF_ENDPOINT: https://hf-mirror.com
      # ---- 缓存全部落在挂载目录 /app/checkpoints（对应宿主机 ./checkpoints）----
      HF_HOME: /app/checkpoints/.hf
      # infer_v2_5 会在 import 时覆盖为 ./checkpoints/hf_cache（cwd=/app 时与下列路径一致）
      HF_HUB_CACHE: /app/checkpoints/hf_cache
      TRANSFORMERS_CACHE: /app/checkpoints/.hf/transformers
      TORCH_HOME: /app/checkpoints/.hf/torch
      XDG_CACHE_HOME: /app/checkpoints/.cache
      MODELSCOPE_CACHE: /app/checkpoints/.hf/modelscope
      HF_HUB_DISABLE_XET: "1"
      # CPU 侧预处理 / BLAS 线程（与 cpus 上限对齐，避免过少线程拖慢特征与音频处理）
      OMP_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      NUMEXPR_NUM_THREADS: "6"
      # 减轻显存碎片导致的卡顿（PyTorch 2.x）
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    volumes:
      - ./docker/checkpoints:/app/checkpoints
      - ./docker/outputs:/app/outputs
      - ./docker/prompts:/app/prompts
    shm_size: 2gb
    cpus: '6'
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次启动需下载权重，预留充足时间
      start_period: 1800s
