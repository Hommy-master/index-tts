# 部署 CI 构建的镜像：Docker Hub 上为 <DOCKERHUB_USERNAME>/index-tts（见 .github/workflows/dev.yml）
# 使用前：在本目录创建 ./checkpoints 并放入模型权重，或改为绑定你已下载权重的目录。
#
# 启动：docker compose up -d
# 环境变量可写在同目录 .env 文件中（勿提交密钥）。
#
# 依赖：已安装 NVIDIA 驱动与 NVIDIA Container Toolkit（nvidia-smi 在宿主机可用）

services:
  index-tts:
    image: gogoshine/index-tts:latest
    container_name: index-tts
    restart: unless-stopped
    ports:
      - 7860:7860
    environment:
      # 可选：限制可见 GPU，例如 "0" 或 "0,1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # 模型目录（与 Dockerfile CMD 中 --model_dir 一致）
      - ./checkpoints:/app/checkpoints
      # 可选：持久化生成结果与提示词
      - ./outputs:/app/outputs
      - ./prompts:/app/prompts
    # Gradio / PyTorch 在默认 64MB shm 下偶发问题，可按需调大
    shm_size: 2gb
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
